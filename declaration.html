<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusLink - Déclarer un incident</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <header class="navbar">
        <div class="logo-container">
            <span class="logo-text"><span class="campus-bold">Campus</span><span class="link-text">Link</span></span>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Tableau de bord</a></li>
                <li><a href="salles.html">Salles & Équipements</a></li>
                <li><a href="incidents.html">Incidents</a></li>
                <li><a href="declaration.html">Déclaration de l'incident</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Déclarer un incident</h1>
        <p class="subtitle">Signalez une panne ou un problème technique sur le campus.</p>

        <section class="dashboard-cards">
            <article class="card" style="grid-column: span 3;">
                <form action="#" method="POST" style="display: flex; flex-direction: column; gap: 15px;">
                    <div>
                        <label for="equipment" style="display: block; font-weight: 600; margin-bottom: 5px; color: #2c3e50;">Équipement ou Salle concernée :</label>
                        <input type="text" id="equipment" name="equipment" placeholder="ex: Projecteur Amphi A, Salle 102..." style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem;" required>
                    </div>

                    <div>
                        <label for="urgency" style="display: block; font-weight: 600; margin-bottom: 5px; color: #2c3e50;">Niveau d'urgence :</label>
                        <select id="urgency" name="urgency" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; background-color: white;" required>
                            <option value="basse">Basse</option>
                            <option value="moyenne">Moyenne</option>
                            <option value="haute">Haute</option>
                        </select>
                    </div>

                    <div>
                        <label for="description" style="display: block; font-weight: 600; margin-bottom: 5px; color: #2c3e50;">Description du problème :</label>
                        <textarea id="description" name="description" rows="4" placeholder="Décrivez le dysfonctionnement rencontré..." style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem;" required></textarea>
                    </div>

                    <button type="submit" style="background-color: #3498db; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.3s ease;">Soumettre le signalement</button>
                </form>
            </article>
        </section>
    </main>
</body>
</html>
